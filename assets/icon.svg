  </defs>
  <rect x="8" y="8" width="184" height="184" rx="36" fill="url(#bg)"/>
  <rect x="8" y="8" width="184" height="184" rx="36" fill="none" stroke="#d4af37" stroke-width="4"/>
  <!-- 日历环 -->
  <rect x="40" y="44" width="120" height="14" rx="6" fill="#d4af37"/>
